<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — MobilePOS</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            text-align: center;
        }
        .card { max-width: 24rem; }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: #475569; line-height: 1.5; }
        button {
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            border: none;
            background: #0f766e;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>MobilePOS needs a connection to load current stock and prices. Reconnect and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
